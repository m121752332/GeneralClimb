<!DOCTYPE html>

<style>
:root{--fg:#1d1d1f;--muted:#6b6b70;--bg:#fbfbf8;--card:#ffffff;--line:#d9d7d0;--accent:#c8322a;--ok:#2f7d4f;--key:#fbe9e7}
@media (prefers-color-scheme:dark){:root{--fg:#ececec;--muted:#a3a3a8;--bg:#17171a;--card:#202024;--line:#3a3a40;--accent:#ff6b5e;--ok:#5fc48a;--key:#3a2220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:1.45rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px;font-size:.95rem}
h2{font-size:1.1rem;margin:36px 0 10px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
svg{width:100%;height:auto;display:block;color:var(--fg)}
figcaption{color:var(--muted);font-size:.88rem;margin-top:10px}
.box{fill:var(--card);stroke:currentColor;stroke-width:1.4}
.box.key{fill:var(--key);stroke:var(--accent)}
.box.fail{stroke:var(--accent);stroke-dasharray:0}
.t{font-size:13px;text-anchor:middle;fill:currentColor;font-weight:600}
.t.fail{fill:var(--accent)}
.s{font-size:10.5px;text-anchor:middle;fill:var(--muted)}
.ln{fill:none;stroke:currentColor;stroke-width:1.3}
.ln.fail{stroke:var(--accent);stroke-dasharray:5 4}
.ln.ok{stroke:var(--ok)}
.lab{font-size:11px;fill:var(--muted)}
.lab.fail{fill:var(--accent)} .lab.ok{fill:var(--ok)}
.seg{stroke:currentColor;stroke-width:1.2;fill:var(--card)}
.seg.pag{fill:color-mix(in srgb,var(--ok) 14%,var(--card))}
.seg.base{fill:color-mix(in srgb,currentColor 8%,var(--card))}
.seg.top{fill:color-mix(in srgb,var(--ok) 26%,var(--card))}
.seg.spire{fill:var(--card)}
.rung{stroke:currentColor;stroke-width:1}
.tick{stroke:var(--line);stroke-width:1}
.lv{font-size:12px;font-weight:700;fill:currentColor}
.t2{font-size:11.5px;fill:currentColor}
.pc{font-size:11.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.tip{stroke:var(--accent);stroke-width:2} .tipdot{fill:var(--accent)}
ul{padding-left:1.2em} li{margin:4px 0}
</style></head>

<h2>三、規則重點</h2>
<ul>
<li>同一時間只有一個危機事件；其他到期事件排隊，前一個結束 4 秒後才觸發。</li>
<li>事件前 1 秒左上角出現圖示；放開方向鍵即抓牢，對老鷹等同隱身。</li>
<li>計時只算實際攀爬時間；墜落重來時全部歸零。</li>
</ul>
